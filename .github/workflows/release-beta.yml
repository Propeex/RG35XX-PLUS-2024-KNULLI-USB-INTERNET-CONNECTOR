name: Publish KNULLI USB Link beta

# Release only the exact main-branch commit that successfully built and
# verified the Windows portable ZIP. No pull request can publish a release.
on:
  workflow_run:
    workflows: ["Windows EXE build (development)"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: read

concurrency:
  group: knulli-usb-link-v0.1.0-beta.2
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.event == 'push'
          && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exactly the successful source commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Verify version, main head and single-publish safety
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*<InformationalVersion>\([^<]*\)<\/InformationalVersion>.*/\1/p' src/Connector/Connector.csproj)"
          test "$version" = "0.1.0-beta.2" || { echo "Unexpected version: $version"; exit 1; }
          grep -Fq '<TargetFramework>net10.0-windows</TargetFramework>' src/Connector/Connector.csproj \
            || { echo 'Public release must target supported .NET 10 LTS'; exit 1; }
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          test "$current_main" = "$VERIFIED_SHA" || { echo 'main changed since tested commit; refusing stale release'; exit 1; }
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v0.1.0-beta.2" >/dev/null 2>&1; then
            echo 'Beta tag already exists; never publish an unintended replacement.'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download only the successful build artifact
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$VERIFIED_RUN" --repo "$GITHUB_REPOSITORY" \
            --name windows-portable-zip --dir dist
          test -s dist/RG35XX-USB-Internet-Connector-dev.zip
          mv dist/RG35XX-USB-Internet-Connector-dev.zip \
            dist/RG35XX-USB-Internet-Connector.zip
          unzip -t dist/RG35XX-USB-Internet-Connector.zip | grep -F 'No errors detected'
          unzip -Z -1 dist/RG35XX-USB-Internet-Connector.zip | grep -Fx 'KNULLI USB Link.exe'
          unzip -Z -1 dist/RG35XX-USB-Internet-Connector.zip | grep -Fx 'RG35XXUsbInternetConnector.exe'
          unzip -Z -1 dist/RG35XX-USB-Internet-Connector.zip | grep -Fx 'backend/SHA256SUMS'
          size="$(stat -c%s dist/RG35XX-USB-Internet-Connector.zip)"
          test "$size" -ge 1000000 && test "$size" -le 30000000
          (cd dist && sha256sum RG35XX-USB-Internet-Connector.zip > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Create GitHub Beta Release with checksum
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          gh release create v0.1.0-beta.2 \
            dist/RG35XX-USB-Internet-Connector.zip \
            dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$VERIFIED_SHA" \
            --title "KNULLI USB Link v0.1.0-beta.2" \
            --prerelease \
            --latest=false \
            --notes-file docs/RELEASE_NOTES_v0.1.0-beta.2.md

      - name: Check published asset digests
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v0.1.0-beta.2" \
            --jq '. | {tag_name, draft, prerelease, assets: [.assets[] | {name, size, digest}]}' | tee dist/release-result.json
          jq -e '.tag_name == "v0.1.0-beta.2" and .draft == false and .prerelease == true' dist/release-result.json
          jq -e '.assets | any(.name == "RG35XX-USB-Internet-Connector.zip" and (.digest | startswith("sha256:")))' dist/release-result.json
          jq -e '.assets | any(.name == "SHA256SUMS.txt")' dist/release-result.json
